services:

  ip_web:
    build: .
    container_name: ip_web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      ip_db:
        condition: service_healthy
    restart: always
    networks:
      - ip-rede

  ip_db:
    image: postgres:17
    container_name: ip_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    networks:
      - ip-rede

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ip_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "4000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - ip_db
    networks:
      - ip-rede

volumes:
  postgres_data:
  pgadmin_data:

networks:
  ip-rede:
    driver: bridge